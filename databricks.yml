# Databricks Asset Bundle config for this project.
# Deploy with: databricks bundle deploy -t dev   (or -t prod)
# `include: resources/*.yml` below picks up every job definition in
# resources/ automatically, so no changes are needed here to add a new job -
# this currently wires up:
#   - resources/ingest_ticker_news_embeddings_job.yml (ticker news -> pgvector)
#   - resources/ingest_weather_embeddings_job.yml (weather_documents -> pgvector)

bundle:
  name: databricks-lakebase-app-day-2

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<your-workspace-instance>.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://<your-workspace-instance>.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
