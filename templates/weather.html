<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Intelligence Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
        }
        .search-bar {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        .search-bar input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        .search-bar button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .search-bar button:hover {
            background: #5568d3;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            padding: 12px 24px;
            background: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }
        .tab.active {
            background: #667eea;
            color: white;
        }
        .cities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .city-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .city-card:hover {
            transform: translateY(-5px);
        }
        .city-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .city-name {
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }
        .last-updated {
            font-size: 12px;
            color: #999;
        }
        .weather-section {
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .alert-badge {
            display: inline-block;
            padding: 6px 12px;
            background: #ff6b6b;
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .forecast-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .forecast-period {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        .forecast-text {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
        .alert-item {
            padding: 15px;
            background: #fff5f5;
            border-left: 4px solid #ff6b6b;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .alert-headline {
            font-weight: 600;
            color: #c92a2a;
            margin-bottom: 5px;
        }
        .alert-text {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }
        .error {
            background: #fff5f5;
            border: 2px solid #ff6b6b;
            border-radius: 8px;
            padding: 20px;
            color: #c92a2a;
            margin: 20px 0;
        }
        .empty-state {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 15px;
            color: #999;
        }
        .empty-state h2 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌤️ Weather Intelligence Dashboard</h1>
            <p class="subtitle">Real-time weather alerts and forecasts from the National Weather Service</p>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search weather information...">
                <button onclick="searchWeather()">Search</button>
            </div>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="showTab('all')">All Locations</button>
            <button class="tab" onclick="showTab('alerts')">Active Alerts</button>
        </div>

        <div id="loading" class="loading">Loading weather data...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="content" style="display: none;">
            <div id="citiesGrid" class="cities-grid"></div>
            <div id="alertsGrid" class="cities-grid" style="display: none;"></div>
        </div>
    </div>

    <script>
        let weatherData = {};
        let currentTab = 'all';

        async function loadWeatherData() {
            try {
                const locationsResponse = await fetch('/weather/locations');
                const locations = await locationsResponse.json();

                for (const loc of locations) {
                    const location = loc.location;
                    const cityResponse = await fetch(`/weather/city/${encodeURIComponent(location)}`);
                    weatherData[location] = await cityResponse.json();
                }

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                renderWeather();
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = `Error loading weather data: ${error.message}`;
            }
        }

        function renderWeather() {
            if (currentTab === 'all') {
                renderAllCities();
            } else {
                renderAlerts();
            }
        }

        function renderAllCities() {
            const grid = document.getElementById('citiesGrid');
            grid.innerHTML = '';

            if (Object.keys(weatherData).length === 0) {
                grid.innerHTML = '<div class="empty-state"><h2>No weather data available</h2><p>Run the weather sync to fetch data</p></div>';
                return;
            }

            for (const [location, data] of Object.entries(weatherData)) {
                const cityCard = createCityCard(location, data);
                grid.appendChild(cityCard);
            }
        }

        function createCityCard(location, data) {
            const card = document.createElement('div');
            card.className = 'city-card';

            const alerts = data.alerts || [];
            const forecasts = data.forecasts || [];
            const allDocs = [...alerts, ...forecasts];
            const lastUpdate = allDocs.length > 0 && allDocs[0].issued_at ? new Date(allDocs[0].issued_at).toLocaleString() : 'Never';

            // Derive city name from coordinates if possible
            const cityName = getCityName(location);

            card.innerHTML = `
                <div class="city-header">
                    <div>
                        <div class="city-name">${cityName}</div>
                        <div class="last-updated">Last updated: ${lastUpdate}</div>
                    </div>
                    ${alerts.length > 0 ? `<div class="alert-badge">${alerts.length} Alert${alerts.length > 1 ? 's' : ''}</div>` : ''}
                </div>
            `;

            if (alerts.length > 0) {
                const alertSection = document.createElement('div');
                alertSection.className = 'weather-section';
                alertSection.innerHTML = '<div class="section-title">⚠️ Active Alerts</div>';
                
                alerts.forEach(alert => {
                    const alertDiv = document.createElement('div');
                    alertDiv.className = 'alert-item';
                    alertDiv.innerHTML = `
                        <div class="alert-headline">${alert.headline || 'Weather Alert'}</div>
                        <div class="alert-text">${truncateText(alert.narrative_text, 200)}</div>
                    `;
                    alertSection.appendChild(alertDiv);
                });
                card.appendChild(alertSection);
            }

            if (forecasts.length > 0) {
                const forecastSection = document.createElement('div');
                forecastSection.className = 'weather-section';
                forecastSection.innerHTML = '<div class="section-title">📅 Forecast</div>';
                
                forecasts.slice(0, 3).forEach(forecast => {
                    const forecastDiv = document.createElement('div');
                    forecastDiv.className = 'forecast-item';
                    forecastDiv.innerHTML = `
                        <div class="forecast-period">${forecast.headline || 'Forecast Period'}</div>
                        <div class="forecast-text">${truncateText(forecast.narrative_text, 150)}</div>
                    `;
                    forecastSection.appendChild(forecastDiv);
                });
                card.appendChild(forecastSection);
            }

            return card;
        }

        async function renderAlerts() {
            const grid = document.getElementById('alertsGrid');
            grid.innerHTML = '<div class="loading">Loading alerts...</div>';

            try {
                const response = await fetch('/weather/alerts');
                const alerts = await response.json();

                grid.innerHTML = '';

                if (alerts.length === 0) {
                    grid.innerHTML = '<div class="empty-state"><h2>No active alerts</h2><p>All clear! No weather alerts at this time.</p></div>';
                    return;
                }

                alerts.forEach(alert => {
                    const card = document.createElement('div');
                    card.className = 'city-card';
                    const cityName = getCityName(alert.location);
                    const issueDate = new Date(alert.issued_at).toLocaleString();

                    card.innerHTML = `
                        <div class="city-header">
                            <div>
                                <div class="city-name">${cityName}</div>
                                <div class="last-updated">Issued: ${issueDate}</div>
                            </div>
                            <div class="alert-badge">Alert</div>
                        </div>
                        <div class="alert-item">
                            <div class="alert-headline">${alert.headline || 'Weather Alert'}</div>
                            <div class="alert-text">${alert.narrative_text || 'No details available'}</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                grid.innerHTML = `<div class="error">Error loading alerts: ${error.message}</div>`;
            }
        }

        function showTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            document.getElementById('citiesGrid').style.display = tab === 'all' ? 'grid' : 'none';
            document.getElementById('alertsGrid').style.display = tab === 'alerts' ? 'grid' : 'none';

            if (tab === 'alerts') {
                renderAlerts();
            }
        }

        async function searchWeather() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;

            const grid = document.getElementById('citiesGrid');
            grid.innerHTML = '<div class="loading">Searching weather data...</div>';

            try {
                const response = await fetch(`/weather/search?query=${encodeURIComponent(query)}&limit=20`);
                const data = await response.json();

                grid.innerHTML = '';

                if (data.count === 0 || !data.results || data.results.length === 0) {
                    grid.innerHTML = '<div class="empty-state"><h2>No results found</h2><p>Try a different search term</p></div>';
                    return;
                }

                // Group results by location
                const grouped = {};
                data.results.forEach(item => {
                    if (!grouped[item.location]) {
                        grouped[item.location] = [];
                    }
                    grouped[item.location].push(item);
                });

                for (const [location, data] of Object.entries(grouped)) {
                    const card = createCityCard(location, data);
                    grid.appendChild(card);
                }
            } catch (error) {
                alert(`Search error: ${error.message}`);
            }
        }

        function getCityName(location) {
            // Map of coordinates to city names
            const cityMap = {
                '41.8781,-87.6298': 'Chicago, IL',
                '30.2672,-97.7431': 'Austin, TX',
                '47.6062,-122.3321': 'Seattle, WA'
            };
            return cityMap[location] || location;
        }

        function truncateText(text, maxLength) {
            if (!text) return '';
            if (text.length <= maxLength) return text;
            return text.substring(0, maxLength) + '...';
        }

        // Load data on page load
        loadWeatherData();
    </script>
</body>
</html>
